<title>Zuri Business OS Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: dark espresso rail, warm light workspace, amber used only for the one thing that matters on each screen. */
:root{
  --bg:#F6F1E8; --surface:#FFFFFF; --surface-2:#FBF8F2; --ink:#1F160C; --ink-2:#5B4E40; --ink-3:#85796A; --line:#E8DFD0;
  --amber:#E08E0B; --amber-ink:#8F5500; --amber-soft:#FCEFD3;
  --good:#2E7D4F; --good-soft:#E3F3E8; --bad:#B8362A; --bad-soft:#FBE6E3; --warn:#A8700F; --warn-soft:#FBF0D5;
  --side:#1B120A; --side-ink:#EADFCC; --side-dim:#9C8F7C; --shadow:0 1px 2px rgba(60,35,5,.06),0 8px 24px -12px rgba(60,35,5,.18);
  --f-display:"Cormorant Garamond",Georgia,serif; --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130D07; --surface:#1E1610; --surface-2:#251B13; --ink:#F4EBDD; --ink-2:#C4B7A5; --ink-3:#8E8171; --line:#35281C;
  --amber:#F0A21C; --amber-ink:#F5B84A; --amber-soft:#3A2A10; --good:#5CC38A; --good-soft:#17301F; --bad:#F07A6B; --bad-soft:#3A1A16; --warn:#E8B04A; --warn-soft:#3A2C10;
  --side:#0E0905; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130D07; --surface:#1E1610; --surface-2:#251B13; --ink:#F4EBDD; --ink-2:#C4B7A5; --ink-3:#8E8171; --line:#35281C;
  --amber:#F0A21C; --amber-ink:#F5B84A; --amber-soft:#3A2A10; --good:#5CC38A; --good-soft:#17301F; --bad:#F07A6B; --bad-soft:#3A1A16; --warn:#E8B04A; --warn-soft:#3A2C10;
  --side:#0E0905; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600}
.display{font-family:var(--f-display);letter-spacing:-.01em}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg);transition:opacity .6s,transform .6s,visibility .6s}
#login.out{opacity:0;transform:scale(1.02);visibility:hidden}
.scene{position:relative;overflow:hidden;background:linear-gradient(180deg,#2b1a3a 0%,#7a3b4a 38%,#e98a2e 70%,#f6c26b 100%);border-radius:0 38% 38% 0/0 50% 50% 0;box-shadow:12px 0 0 -2px var(--amber)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.sun{animation:sun 9s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes sun{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
.road-dash{animation:dash 1.1s linear infinite}
@keyframes dash{to{transform:translateX(-120px)}}
.car{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.wheel{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.far{animation:far 60s linear infinite}
@keyframes far{to{transform:translateX(-400px)}}
.dust{animation:dust 1.6s ease-out infinite;opacity:0}
.dust:nth-child(2){animation-delay:.5s}.dust:nth-child(3){animation-delay:1s}
@keyframes dust{0%{opacity:.5;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-60px,-12px) scale(1.6)}}
.scene-copy{position:absolute;left:clamp(24px,5vw,64px);top:clamp(24px,5vw,56px);color:#fff}
.brand-row{display:flex;align-items:center;gap:12px}
.emblem{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#F6B53A,#E08E0B 60%,#B96A00);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.emblem svg{position:static;width:28px;height:28px}
.scene-copy .display{font-size:clamp(34px,4.5vw,58px);line-height:1.02;margin-top:clamp(20px,5vh,56px)}
.scene-copy p{opacity:.85;letter-spacing:.04em;margin:12px 0 0}
.login-side{display:grid;place-items:center;padding:24px;position:relative}
.login-card{width:100%;max-width:25rem;background:var(--surface);border-radius:28px;padding:36px 34px;box-shadow:var(--shadow);transform:translateY(16px);opacity:0;animation:rise .8s .35s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{transform:none;opacity:1}}
.login-card h2{font:600 34px/1.1 var(--f-display);margin-top:18px;text-align:center}
.login-card .sub{text-align:center;color:var(--ink-3);margin-top:4px}
.field{position:relative;margin-top:14px}
.field input{width:100%;height:52px;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:0 16px;color:var(--ink);font:inherit;outline:none;transition:border .2s,box-shadow .2s}
.field input:focus{border-color:var(--amber);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 18%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(180deg,#F0A21C,#E08E0B);border-color:transparent;color:#fff;box-shadow:0 10px 24px -12px rgba(224,142,11,.8)}
.btn.big{height:52px;width:100%;border-radius:16px;margin-top:18px;font-size:15px}
.btn.sm{height:32px;padding:0 12px;border-radius:10px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.rail{background:var(--side);color:var(--side-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.rail .brand-row{padding:4px 8px 18px}
.rail .brand-row b{font:600 20px/1 var(--f-display);display:block}
.rail .brand-row small{color:var(--side-dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.rail .emblem{width:40px;height:40px}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--side-dim);font-weight:500;transition:color .2s}
.nav a:hover{color:var(--side-ink)}
.nav a.on{color:#fff}
.nav a svg{width:18px;height:18px;flex:none}
.nav .pill{position:absolute;left:0;right:0;height:40px;border-radius:12px;background:rgba(224,142,11,.18);box-shadow:inset 3px 0 0 var(--amber);transition:transform .35s cubic-bezier(.3,.8,.2,1),height .2s;z-index:0}
.nav .badge{margin-left:auto;background:var(--amber);color:#1b120a;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.av{width:32px;height:32px;border-radius:50%;background:var(--amber);color:#1b120a;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me small{display:block;color:var(--side-dim);font-size:11px}
.main{min-width:0;padding:28px max(24px,3vw) 80px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font:600 clamp(30px,3.4vw,40px)/1.05 var(--f-display)}
.top .sub{color:var(--ink-3);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:all .2s}
.chip:hover{border-color:var(--amber)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#view{animation:view .45s cubic-bezier(.2,.7,.2,1)}
@keyframes view{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:view .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}

/* ---------- Components ---------- */
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:1fr 1fr}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.hero .big{font:600 clamp(40px,5vw,64px)/1 var(--f-display);margin:6px 0 2px}
.hero .lab{color:var(--ink-3);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.delta{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:3px 10px;border-radius:999px;font-size:12.5px}
.delta.up{background:var(--good-soft);color:var(--good)}.delta.down{background:var(--bad-soft);color:var(--bad)}
.kpi .v{font:600 30px/1.1 var(--f-display);margin-top:4px}
.kpi .l{color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.kpi .s{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-hire{background:var(--amber-soft);color:var(--amber-ink)}.s-avail{background:var(--good-soft);color:var(--good)}.s-booked{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.s-maint,.s-bad{background:var(--bad-soft);color:var(--bad)}.s-warn{background:var(--warn-soft);color:var(--warn)}
.attn{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateX(3px);box-shadow:var(--shadow)}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line))}
.item.bad{--c:var(--bad)}.item.warn{--c:var(--amber)}.item.good{--c:var(--good)}
.item .t{font-weight:600}.item .d{color:var(--ink-3);font-size:12.5px}
.item .go{margin-left:auto;flex:none}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 10px 10px}
.table td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
.table tr{transition:background .15s}.table tbody tr:hover{background:var(--surface-2)}
.r{text-align:right}
.scroll{overflow-x:auto}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--amber);width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.vcard{display:flex;flex-direction:column;gap:12px}
.vcard .name{font:600 22px/1.1 var(--f-display)}
.vcard .plate{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.kv{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2)}
.kv b{color:var(--ink)}
.docs{display:flex;gap:6px;flex-wrap:wrap}
.doc{font-size:11.5px;font-weight:600;border-radius:8px;padding:2px 8px;background:var(--good-soft);color:var(--good)}
.doc.warn{background:var(--warn-soft);color:var(--warn)}.doc.bad{background:var(--bad-soft);color:var(--bad)}
.prose{max-width:68ch}
.prose p{margin:0 0 14px;font-size:15px;line-height:1.7}
.hl-g{background:var(--good-soft);color:var(--good);padding:0 5px;border-radius:5px;font-weight:600}
.hl-r{background:var(--bad-soft);color:var(--bad);padding:0 5px;border-radius:5px;font-weight:600}
.hl-a{background:var(--amber-soft);color:var(--amber-ink);padding:0 5px;border-radius:5px;font-weight:600}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.todo .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--amber-soft);color:var(--amber-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.pl td:first-child{color:var(--ink-2)}.pl .sub td{font-weight:700;background:var(--surface-2)}.pl .net td{font:600 18px var(--f-display);border-top:2px solid var(--ink)}
svg text{fill:var(--ink-3);font:11px var(--f-ui)}
.legend{display:flex;gap:14px;color:var(--ink-3);font-size:12px;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg{display:flex;gap:2px;height:12px;border-radius:99px;overflow:hidden}
.seg i{display:block;height:100%}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(20,12,4,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:31;transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:26px;overflow:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sheet h2{font:600 30px var(--f-display);margin-bottom:16px}
.f{display:grid;gap:6px;margin-bottom:14px}.f label{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.f input,.f select,.f textarea{height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:0 12px;color:var(--ink);font:inherit;outline:none}
.f input:focus,.f select:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 18%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.menu-btn{display:none}
.mockbadge{position:fixed;right:12px;bottom:12px;z-index:5;font-size:11px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

@media (max-width:1000px){
  .hero,.g2,.g3,.g4,.g21{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
  #login{grid-template-columns:1fr;grid-template-rows:240px 1fr}.scene{border-radius:0 0 32px 32px;box-shadow:0 8px 0 -2px var(--amber)}
  .scene-copy .display,.scene-copy p{display:none}
  #app{grid-template-columns:1fr}
  .rail{position:fixed;z-index:40;left:0;top:0;width:260px;transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .rail.on{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding:16px max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

          <path d="M92 12 L56 44 L150 44 L150 12 Z M160 12 L160 44 L244 44 L222 12 Z" fill="#6a4a36" opacity=".85"/>

          <rect x="290" y="62" width="22" height="9" rx="4" fill="#ffe2a0"/>
          <rect x="0" y="66" width="10" height="9" rx="4" fill="#d6402c"/>
          <rect x="120" y="70" width="56" height="12" rx="3" fill="#E08E0B"/><text x="148" y="80" text-anchor="middle" style="fill:#1b120a;font:700 9px sans-serif">ZURI</text>
          <g transform="translate(66 98)"><circle r="25" fill="#0a0806"/><circle class="wheel" r="14" fill="#6b5c4b"/><g class="wheel" stroke="#b9a68b" stroke-width="3"><path d="M-12 0H12M0 -12V12"/></g></g>

        </g>
        <g transform="translate(236 600)"><circle class="dust" r="10" fill="#d9b684"/><circle class="dust" r="8" fill="#d9b684"/><circle class="dust" r="12" fill="#d9b684"/></g>
      </g>
    </svg>
    <div class="scene-copy">
      <div class="brand-row"><div class="emblem"><svg viewBox="0 0 24 24" fill="none" stroke="#1b120a" stroke-width="1.8" stroke-linecap="round"><path d="M12 21V8M12 8c-2-3-5-3-7-2 3 0 5 1 7 2zm0 0c2-3 5-3 7-2-3 0-5 1-7 2z"/><path d="M4 21h16"/></svg></div><div><div class="display" style="font-size:26px;margin:0;line-height:1">Zuri Tours</div><div style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.8">&amp; Car Hire</div></div></div>
      <div class="display">Zuri Business OS</div>
      <p>Manage. Operate. Grow.</p>
    </div>
  </div>

function bars(vals,labels,opts={}){

  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/max,x=pl+i*bw+bw*.2,y=H-pb-h,soft=opts.softLast&&i===vals.length-1;

    <text x="${x+bw*.3}" y="${y-6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${M(v)}</text><text x="${x+bw*.3}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Profit by month"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--amber-soft)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--amber)" stroke-width="2"/></pattern></defs>${g}</svg>`;
}
function area(vals,days,color='var(--amber)'){

  const X=i=>pl+(W-pl-8)*i/(vals.length-1),Y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`);let g='';

  [0,Math.floor(vals.length/2),vals.length-1].forEach(i=>g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===vals.length-1?'end':i===0?'start':'middle'}">${days[i]}</text>`);

}

/* ---------- shell ---------- */
const nav=$('#nav');
NAV.forEach(([id,label,i,b])=>{nav.insertAdjacentHTML('beforeend',`<a href="#${id}" data-id="${id}">${ICON(i)}<span>${label}</span>${b?`<span class="badge">${b}</span>`:''}</a>`)});
function movePill(){const a=$('.nav a.on');if(!a)return;const p=$('#pill');p.style.transform=`translateY(${a.offsetTop}px)`;p.style.height=a.offsetHeight+'px'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function countUp(){$$('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),d=1100;const step=n=>{const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=T(to*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function render(){
  const id=(location.hash||'#dashboard').slice(1),pg=pages[id]?id:'dashboard';
  $$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===pg));
  const v=$('#view');v.style.animation='none';v.offsetHeight;v.style.animation='';
  v.innerHTML=pages[pg]();movePill();countUp();
  requestAnimationFrame(()=>$$('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%'));
  $('#rail').classList.remove('on');scrollTo(0,0);
}
addEventListener('hashchange',render);addEventListener('resize',movePill);
document.fonts&&document.fonts.ready.then(movePill);

/* sheet */
function openSheet(html){const s=$('#sheet');s.innerHTML=html;s.classList.add('on');$('#scrim').classList.add('on');s.setAttribute('aria-hidden','false')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');$('#sheet').setAttribute('aria-hidden','true')}
$('#scrim').onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

<div class="f"><label for="n1">Customer</label><input id="n1" placeholder="Name or company"></div>
<div class="two"><div class="f"><label for="n2">Pickup</label><input id="n2" value="Fri 20 Nov, 07:00"></div><div class="f"><label for="n3">Return</label><input id="n3" placeholder="Optional"></div></div>

const confirmDel=()=>`<h2>Delete this record?</h2><p style="color:var(--ink-2)">This also removes its invoices and trip costs. It cannot be undone.</p><div style="display:flex;gap:10px;margin-top:18px"><button class="btn danger" id="yesdel" style="flex:1">Delete</button><button class="btn ghost" id="cancelb">Keep it</button></div>`;
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.id==='newb')openSheet(newBooking());
  else if(t.id==='saveb'){closeSheet();toast('Booking saved')}
  else if(t.id==='cancelb')closeSheet();
  else if(t.hasAttribute('data-del'))openSheet(confirmDel());
  else if(t.id==='yesdel'){closeSheet();toast('Deleted')}
  else if(t.dataset.toast)toast(t.dataset.toast);
  else if(t.hasAttribute('data-chip')){$$('[data-chip]').forEach(c=>c.classList.remove('on'));t.classList.add('on')}
  else if(t.classList.contains('chip')){t.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));t.classList.add('on')}
  else if(t.id==='menu')$('#rail').classList.toggle('on');
  else if(t.id==='theme'){const r=document.documentElement,dark=getComputedStyle(r).colorScheme.includes('dark');r.setAttribute('data-theme',dark?'light':'dark')}
});

if(location.hash&&location.hash!=='#login'){ }
